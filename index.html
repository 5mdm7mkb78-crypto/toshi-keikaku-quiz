<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都市計画 技術士二次試験対策</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #f5f0e8;
    --accent: #c0392b;
    --accent2: #2c3e6b;
    --muted: #7a7062;
    --border: #d4cdc0;
    --correct: #27ae60;
    --wrong: #c0392b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }
  header { background: var(--accent2); color: white; padding: 16px 20px; text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
  header h1 { font-family: 'Noto Serif JP', serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; }
  header p { font-size: 0.7rem; opacity: 0.75; margin-top: 2px; }
  main { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
  .tab { flex: 1; padding: 10px; border: 2px solid var(--border); background: white; border-radius: 8px; font-size: 0.85rem; font-family: 'Noto Sans JP', sans-serif; cursor: pointer; transition: all 0.2s; color: var(--muted); }
  .tab.active { border-color: var(--accent2); background: var(--accent2); color: white; font-weight: 500; }
  .section { display: none; }
  .section.active { display: block; }

  /* 記事一覧 */
  .article-list { display: flex; flex-direction: column; gap: 10px; }
  .article-list-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: all 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .article-list-item:hover { border-color: var(--accent2); transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
  .article-list-left { display: flex; flex-direction: column; gap: 5px; }
  .article-tag { display: inline-block; background: var(--accent2); color: white; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; letter-spacing: 0.05em; width: fit-content; }
  .article-list-title { font-family: 'Noto Serif JP', serif; font-size: 0.95rem; font-weight: 700; line-height: 1.4; }
  .article-list-arrow { color: var(--accent2); font-size: 1.2rem; flex-shrink: 0; margin-left: 10px; }

  /* 記事詳細 */
  .article-detail { display: none; }
  .article-detail.active { display: block; }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    color: var(--accent2);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.85rem;
    cursor: pointer;
    margin-bottom: 16px;
    padding: 4px 0;
  }
  .back-btn:hover { opacity: 0.7; }
  .article-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .article-card .article-tag { margin-bottom: 10px; }
  .article-card-title { font-family: 'Noto Serif JP', serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 14px; line-height: 1.5; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
  .article-body { font-size: 0.87rem; line-height: 1.9; color: #333; }
  .article-body p { margin-bottom: 10px; }
  .article-body strong { color: var(--accent2); }
  .article-nav { display: flex; gap: 10px; margin-top: 16px; }
  .article-nav-btn { flex: 1; padding: 12px; border: 2px solid var(--accent2); border-radius: 8px; background: white; color: var(--accent2); font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .article-nav-btn:hover { background: var(--accent2); color: white; }
  .article-nav-btn:disabled { border-color: var(--border); color: var(--muted); cursor: default; background: white; }

  /* 問題演習 */
  .quiz-controls { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .quiz-status { font-size: 0.8rem; color: var(--muted); }
  .score-badge { background: var(--accent2); color: white; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; }
  .quiz-card { background: white; border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,0.06); margin-bottom: 16px; }
  .quiz-difficulty { display: inline-block; font-size: 0.65rem; padding: 3px 8px; border-radius: 4px; margin-bottom: 12px; letter-spacing: 0.05em; }
  .diff-易 { background: #e8f5e9; color: #27ae60; }
  .diff-普通 { background: #fff3e0; color: #e67e22; }
  .diff-難 { background: #fce4ec; color: #c0392b; }
  .quiz-question { font-family: 'Noto Serif JP', serif; font-size: 0.95rem; line-height: 1.7; margin-bottom: 16px; font-weight: 700; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .choice-btn { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: 8px; background: white; font-family: 'Noto Sans JP', sans-serif; font-size: 0.85rem; text-align: left; cursor: pointer; transition: all 0.2s; line-height: 1.5; color: var(--ink); }
  .choice-btn:active { transform: scale(0.98); }
  .choice-btn.selected-correct { border-color: var(--correct); background: #e8f5e9; color: var(--correct); font-weight: 500; }
  .choice-btn.selected-wrong { border-color: var(--wrong); background: #fce4ec; color: var(--wrong); font-weight: 500; }
  .choice-btn.show-correct { border-color: var(--correct); background: #e8f5e9; color: var(--correct); }
  .choice-btn:disabled { cursor: default; }
  .feedback-box { margin-top: 14px; padding: 14px; border-radius: 8px; font-size: 0.83rem; line-height: 1.7; display: none; }
  .feedback-box.correct { display: block; background: #e8f5e9; border-left: 4px solid var(--correct); }
  .feedback-box.wrong { display: block; background: #fce4ec; border-left: 4px solid var(--wrong); }
  .feedback-box .fb-title { font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; }
  .next-btn { width: 100%; margin-top: 14px; padding: 14px; background: var(--accent2); color: white; border: none; border-radius: 10px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; display: none; }
  .restart-btn { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: 'Noto Sans JP', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-top: 12px; }
</style>
</head>
<body>
<header>
  <h1>都市計画 技術士二次試験対策</h1>
  <p>建設部門 ／ 都市及び地方計画</p>
</header>
<main>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('article')">📖 解説記事</button>
    <button class="tab" onclick="switchTab('quiz')">✏️ 問題演習</button>
  </div>

  <!-- 解説記事タブ -->
  <div id="article-section" class="section active">
    <!-- 一覧表示 -->
    <div id="article-list-view">
      <div class="article-list" id="article-list"></div>
    </div>
    <!-- 詳細表示 -->
    <div id="article-detail-view" style="display:none;">
      <button class="back-btn" onclick="showArticleList()">← 記事一覧に戻る</button>
      <div class="article-card">
        <span class="article-tag" id="detail-tag"></span>
        <div class="article-card-title" id="detail-title"></div>
        <div class="article-body" id="detail-body"></div>
      </div>
      <div class="article-nav">
        <button class="article-nav-btn" id="prev-btn" onclick="navigateArticle(-1)">← 前の記事</button>
        <button class="article-nav-btn" id="next-article-btn" onclick="navigateArticle(1)">次の記事 →</button>
      </div>
    </div>
  </div>

  <!-- 問題演習タブ -->
  <div id="quiz-section" class="section">
    <div class="quiz-controls">
      <span class="quiz-status" id="quiz-status"></span>
      <span class="score-badge" id="score-badge">0 / 0</span>
    </div>
    <div id="quiz-container"></div>
  </div>
</main>

<script>
// ============================================================
// 📖 解説記事データ（自由に追加・編集してください）
// ============================================================
const ARTICLES = [
  {
    tag: "都市計画法",
    title: "都市計画法の基本体系",
    body: [
      "都市計画法（1968年制定）は、都市の健全な発展と秩序ある整備を目的とする基本法です。",
      "法の体系は「<strong>都市計画区域の指定</strong>」「<strong>区域区分（線引き）</strong>」「<strong>地域地区</strong>」「<strong>都市施設</strong>」「<strong>市街地開発事業</strong>」から構成されます。",
      "技術士試験では、都市計画決定の手続き（都道府県・市町村の権限分担）や、近年の法改正（立地適正化計画など）との関連が頻出です。"
    ]
  },
  {
    tag: "用途地域",
    title: "用途地域の種類と規制内容",
    body: [
      "用途地域は市街化区域に必ず定める地域地区で、現在<strong>13種類</strong>あります（2019年に田園住居地域が追加）。",
      "住居系8種・商業系2種・工業系3種に分類され、それぞれ建築できる用途・容積率・建ぺい率が定められています。",
      "試験では各用途地域で建築可能な用途の判断や、容積率・建ぺい率の計算問題が出題される傾向があります。"
    ]
  },
  {
    tag: "立地適正化計画",
    title: "立地適正化計画とコンパクトシティ",
    body: [
      "立地適正化計画は2014年の都市再生特別措置法改正により創設された制度で、<strong>居住誘導区域</strong>と<strong>都市機能誘導区域</strong>を設定します。",
      "人口減少・超高齢社会に対応するため、都市機能と居住をコンパクトに集約し、公共交通と連携した「<strong>コンパクト・プラス・ネットワーク</strong>」の実現を目指します。",
      "技術士試験では、計画の目的・区域設定の考え方・誘導施策（届出制度等）について問われます。"
    ]
  }
];

// ============================================================
// ✏️ 問題データ（自由に追加・編集してください）
// ============================================================
const QUESTIONS = [
  {
    difficulty: "易",
    question: "都市計画法において、市街化区域と市街化調整区域に区分することを何というか。",
    choices: ["地域地区の指定", "区域区分（線引き）", "都市施設の決定", "地区計画の策定"],
    answer: 1,
    explanation: "区域区分（線引き）とは、都市計画区域を市街化区域と市街化調整区域に区分することです。市街化区域は既に市街地を形成している区域および概ね10年以内に優先的かつ計画的に市街化を図る区域、市街化調整区域は市街化を抑制すべき区域です。"
  },
  {
    difficulty: "普通",
    question: "2019年の都市計画法改正で新たに追加された用途地域はどれか。",
    choices: ["準住居地域", "田園住居地域", "近隣商業地域", "準工業地域"],
    answer: 1,
    explanation: "田園住居地域は2019年（平成31年）に追加された用途地域で、農業の利便の増進を図りつつ、これと調和した低層住宅に係る良好な住居の環境を保護するための地域です。これにより用途地域は13種類となりました。"
  },
  {
    difficulty: "普通",
    question: "立地適正化計画において、医療・福祉・商業等の都市機能を誘導する区域を何というか。",
    choices: ["居住誘導区域", "都市機能誘導区域", "特定用途誘導地区", "都市再生緊急整備地域"],
    answer: 1,
    explanation: "都市機能誘導区域は、医療・福祉・商業等の都市機能を都市の中心拠点や生活拠点に誘導・集約することにより、これらの各種サービスの効率的な提供を図る区域です。居住誘導区域は人口密度を維持するために居住を誘導する区域です。"
  },
  {
    difficulty: "難",
    question: "都市再生特別措置法に基づく「居住誘導区域」の説明として正しいものはどれか。",
    choices: [
      "市街化調整区域内に設定することができる",
      "用途地域が定められていない区域にも設定できる",
      "市街化区域内において、人口密度を維持するため居住を誘導すべき区域である",
      "区域外での住宅開発は一切禁止される"
    ],
    answer: 2,
    explanation: "居住誘導区域は市街化区域内において一定の人口密度を維持することで、生活サービスや公共交通の持続的な確保を図る区域です。市街化調整区域には設定できません。また区域外での開発は禁止ではなく、一定規模以上の開発・建築行為に届出義務が課されます。"
  },
  {
    difficulty: "難",
    question: "地区計画に関する記述として誤っているものはどれか。",
    choices: [
      "地区計画は市町村が都市計画として決定する",
      "地区整備計画では建築物の用途・形態・敷地等の制限を定めることができる",
      "地区計画は用途地域が定められていない区域には絶対に定めることができない",
      "地区計画の区域内で建築行為を行う場合、原則として市町村長への届出が必要である"
    ],
    answer: 2,
    explanation: "地区計画は、用途地域が定められていない区域（用途地域外）でも、住宅市街地の開発その他建築物の建築が行われる区域等に定めることができます。したがって「絶対に定めることができない」は誤りです。他の選択肢はいずれも正しい記述です。"
  }
];

// ============================================================
// 以下はアプリの動作コード（通常は編集不要）
// ============================================================
let currentArticleIdx = 0;
let currentQ = 0;
let score = 0;
let total = 0;

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i===0&&tab==='article')||(i===1&&tab==='quiz'));
  });
  document.getElementById('article-section').classList.toggle('active', tab==='article');
  document.getElementById('quiz-section').classList.toggle('active', tab==='quiz');
}

// --- 記事一覧 ---
function renderArticleList() {
  const list = document.getElementById('article-list');
  list.innerHTML = ARTICLES.map((a, i) => `
    <div class="article-list-item" onclick="openArticle(${i})">
      <div class="article-list-left">
        <span class="article-tag">${a.tag}</span>
        <div class="article-list-title">${a.title}</div>
      </div>
      <span class="article-list-arrow">›</span>
    </div>
  `).join('');
}

function openArticle(idx) {
  currentArticleIdx = idx;
  const a = ARTICLES[idx];
  document.getElementById('detail-tag').textContent = a.tag;
  document.getElementById('detail-title').textContent = a.title;
  document.getElementById('detail-body').innerHTML = a.body.map(p => `<p>${p}</p>`).join('');
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-article-btn').disabled = idx === ARTICLES.length - 1;
  document.getElementById('article-list-view').style.display = 'none';
  document.getElementById('article-detail-view').style.display = 'block';
  window.scrollTo(0, 0);
}

function showArticleList() {
  document.getElementById('article-list-view').style.display = 'block';
  document.getElementById('article-detail-view').style.display = 'none';
}

function navigateArticle(dir) {
  const next = currentArticleIdx + dir;
  if (next >= 0 && next < ARTICLES.length) openArticle(next);
}

// --- 問題演習 ---
function renderQuestion() {
  const container = document.getElementById('quiz-container');
  document.getElementById('quiz-status').textContent = `第 ${currentQ + 1} 問 / 全 ${QUESTIONS.length} 問`;
  if (currentQ >= QUESTIONS.length) {
    container.innerHTML = `
      <div class="quiz-card" style="text-align:center;">
        <div style="font-size:2rem; margin-bottom:12px;">🎉</div>
        <div class="quiz-question">全問終了！</div>
        <div style="font-size:1.1rem; color:var(--accent2); font-weight:700; margin:10px 0;">${score} / ${QUESTIONS.length} 問正解</div>
        <button class="restart-btn" onclick="restartQuiz()">もう一度挑戦する</button>
      </div>`;
    return;
  }
  const q = QUESTIONS[currentQ];
  container.innerHTML = `
    <div class="quiz-card">
      <span class="quiz-difficulty diff-${q.difficulty}">${q.difficulty}</span>
      <div class="quiz-question">${q.question}</div>
      <div class="choices">
        ${q.choices.map((c, i) => `
          <button class="choice-btn" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${c}</button>
        `).join('')}
      </div>
      <div class="feedback-box" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        ${currentQ + 1 < QUESTIONS.length ? '次の問題へ →' : '結果を見る'}
      </button>
    </div>`;
}

function selectAnswer(idx) {
  const q = QUESTIONS[currentQ];
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');
  if (idx === q.answer) {
    document.querySelectorAll('.choice-btn')[idx].classList.add('selected-correct');
    feedback.className = 'feedback-box correct';
    feedback.innerHTML = `<div class="fb-title">✅ 正解！</div>${q.explanation}`;
    score++;
  } else {
    document.querySelectorAll('.choice-btn')[idx].classList.add('selected-wrong');
    document.querySelectorAll('.choice-btn')[q.answer].classList.add('show-correct');
    feedback.className = 'feedback-box wrong';
    feedback.innerHTML = `<div class="fb-title">❌ 不正解</div>正解は「${String.fromCharCode(65+q.answer)}. ${q.choices[q.answer]}」です。<br><br>${q.explanation}`;
  }
  total++;
  document.getElementById('score-badge').textContent = `${score} / ${total}`;
  document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() { currentQ++; renderQuestion(); }
function restartQuiz() { currentQ = 0; score = 0; total = 0; document.getElementById('score-badge').textContent = '0 / 0'; renderQuestion(); }

renderArticleList();
renderQuestion();
</script>
</body>
</html>
