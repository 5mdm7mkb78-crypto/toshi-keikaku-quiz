  .cat1-kanri{background:#fff3e0;color:#e65100;}

  .quiz-theme-title{font-family:'Noto Serif JP',serif;font-size:.88rem;font-weight:700;color:var(--accent2);flex:1;}

  .quiz-context{font-size:.77rem;color:var(--muted);line-height:1.65;margin-bottom:12px;padding:9px 11px;background:#f7f3ed;border-radius:8px;border-left:3px solid var(--border);}
  .quiz-question{font-family:'Noto Serif JP',serif;font-size:.92rem;line-height:1.75;margin-bottom:13px;font-weight:700;}
  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice-btn{width:100%;padding:11px 13px;border:2px solid var(--border);border-radius:8px;background:white;font-family:'Noto Sans JP',sans-serif;font-size:.82rem;text-align:left;cursor:pointer;transition:all .15s;line-height:1.5;color:var(--ink);}
  .choice-btn.selected{border-color:var(--accent2);background:#e8eaf6;color:var(--accent2);font-weight:500;}
  .choice-btn.correct-final{border-color:var(--correct);background:#e8f5e9;color:#1b5e20;font-weight:500;}
  .choice-btn.wrong-final{border-color:var(--wrong);background:#fce4ec;color:#b71c1c;}
  .choice-btn.missed{border-color:var(--correct);background:#e8f5e9;color:#1b5e20;}
  .choice-btn:disabled{cursor:default;}
  .submit-btn{width:100%;margin-top:12px;padding:12px;background:var(--accent);color:white;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:.86rem;font-weight:500;cursor:pointer;display:none;}
  .submit-btn:disabled{opacity:.5;cursor:default;}
  .feedback-box{margin-top:11px;padding:14px;border-radius:8px;font-size:.82rem;line-height:1.8;display:none;}
  .feedback-box.correct{display:block;background:#e8f5e9;border-left:4px solid var(--correct);}
  .feedback-box.partial{display:block;background:#fff8e1;border-left:4px solid #f9a825;}
  .feedback-box.wrong{display:block;background:#fce4ec;border-left:4px solid var(--wrong);}
  .feedback-box .fb-title{font-weight:700;margin-bottom:6px;font-size:.88rem;}
  .next-btn{width:100%;margin-top:11px;padding:12px;background:var(--accent2);color:white;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:.86rem;font-weight:500;cursor:pointer;display:none;}
  .finish-card{background:white;border-radius:12px;padding:24px 18px;text-align:center;border:1px solid var(--border);}
  .finish-score{font-size:1.3rem;color:var(--accent2);font-weight:700;margin:10px 0 6px;}
  .btn-row{display:flex;gap:10px;margin-top:16px;}
  .retry-btn{flex:1;padding:12px;background:var(--accent2);color:white;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;}
  .back-theme-btn{flex:1;padding:12px;background:white;color:var(--accent2);border:2px solid var(--accent2);border-radius:10px;font-family:'Noto Sans JP',sans-serif;font-size:.84rem;font-weight:500;cursor:pointer;}
</style>

<header>

<main>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('article')">📖 解説記事</button>
    <button class="tab" onclick="switchTab('theme1')">✏️ 問題演習（Ⅱ-1）</button>
    <button class="tab" onclick="switchTab('theme')">✏️ 問題演習（Ⅱ-2）</button>

      <div class="article-list" id="article-list"></div>
    </div>

        <button class="article-nav-btn" id="prev-btn" onclick="navigateArticle(-1)">← 前の記事</button>
        <button class="article-nav-btn" id="next-article-btn" onclick="navigateArticle(1)">次の記事 →</button>
      </div>

    <div id="theme1-list-view" style="display:block;"></div>

    <div id="theme3-list-view" style="display:block;"></div>
    <div id="quiz3-view" style="display:none;"></div>
  </div>
</main>
<script>

const ARTICLES = [
  { tag:"都市計画法", title:"都市計画法の基本体系", body:[

    "法の体系は「<strong>都市計画区域の指定</strong>」「<strong>区域区分（線引き）</strong>」「<strong>地域地区</strong>」「<strong>都市施設</strong>」「<strong>市街地開発事業</strong>」から構成されます。",
    "技術士試験では、都市計画決定の手続き（都道府県・市町村の権限分担）や、近年の法改正（立地適正化計画など）との関連が頻出です。"
  ]},
  { tag:"用途地域", title:"用途地域の種類と規制内容", body:[
    "用途地域は市街化区域に必ず定める地域地区で、現在<strong>13種類</strong>あります（2019年に田園住居地域が追加）。",
    "住居系8種・商業系2種・工業系3種に分類され、それぞれ建築できる用途・容積率・建ぺい率が定められています。",
    "試験では各用途地域で建築可能な用途の判断や、容積率・建ぺい率の計算問題が出題される傾向があります。"
  ]},
  { tag:"立地適正化計画", title:"立地適正化計画とコンパクトシティ", body:[
    "立地適正化計画は2014年の都市再生特別措置法改正により創設された制度で、<strong>居住誘導区域</strong>と<strong>都市機能誘導区域</strong>を設定します。",
    "人口減少・超高齢社会に対応するため、都市機能と居住をコンパクトに集約し、公共交通と連携した「<strong>コンパクト・プラス・ネットワーク</strong>」の実現を目指します。",
    "技術士試験では、計画の目的・区域設定の考え方・誘導施策（届出制度等）について問われます。"

const CATEGORIES = [
  { key:"keikaku", label:"都市計画・まちづくり制度" },
  { key:"bosai",   label:"防災・減災" },

const THEMES = [
  { id:"t01", cat:"keikaku", title:"景観計画の策定", sub:"歴史的街並みを守る景観法の活用" },
  { id:"t02", cat:"keikaku", title:"立地適正化計画への防災指針の追加", sub:"水災害リスクへの対応" },
  { id:"t03", cat:"keikaku", title:"居住誘導区域の見直し", sub:"豪雨被害を受けた自治体での計画変更" },

  { id:"t05", cat:"keikaku", title:"歴史的風致維持向上地区のまちづくり整備計画", sub:"歴史的景観と開発規制のバランス" },
  { id:"t06", cat:"bosai",   title:"防災公園の整備", sub:"民間施設跡地を活用した広域避難地" },

const QUESTIONS_BY_THEME = {

t01: [
  { difficulty:"普通",
    context:"旧街道沿いの宿場町としての町並みが残る人口10万人規模の地方都市において、町並みに調和しない建築物や屋外広告物が増えつつある中、景観法に基づく景観計画を新たに策定する業務の担当責任者として進める。",
    question:"(1) 景観計画策定の事前調査として適切なものを2つ選べ。",
    choices:["歴史的建造物・景観資源の分布と、調和しない建築物・広告物の立地状況を調査する","景観計画区域内の住民・事業者の景観保全への意識と意向を調査する","デザイン事務所への発注先リストを作成しコンペの準備を開始する","SNSに投稿された観光客の写真を収集して景観の評判を分析する"],
    answers:[0,1],
    explanation:"景観計画の策定では、まず「何を守るか（景観資源の分布）」と「何が阻害しているか（不調和な建築物・広告物の実態）」を空間的に把握することが基本です。歴史的建造物や伝統的な色彩・形態の分布を地図上に落とし込むことで、景観計画区域や重点区域の設定根拠となります。同時に「誰と協力するか」を明確にするため、住民や事業者の景観保全への意識・建替え予定の有無・規制に対する賛否を意向調査で把握します。この2点は後のワークショップや規制基準の策定において合意形成の土台となります。一方、発注先リストの作成やSNS分析は計画策定の本質的な調査ではなく、事前調査段階での優先事項にはなりません。"
  },
  { difficulty:"普通",

    choices:["規制は住民感情を考慮せず最大限厳しくし、違反には即時撤去命令を出す","色彩の制限は設けず完全に自由なデザインを認め、市場に任せる","マンセル値による色彩の数値基準化と、伝統素材使用を推奨するインセンティブ設計をセットにする","視点場（見通しの良い場所）からのフォトモンタージュを作成し守るべき視線軸を可視化する"],
    answers:[2,3],
    explanation:"景観基準の策定では「厳しすぎると地域経済が衰退し、緩すぎると景観が守れない」というジレンマがあります。マンセル値を用いて色相・明度・彩度を数値で規定することで、恣意的な運用を防ぎつつ客観的な判断基準を設けられます。あわせて木材・漆喰などの伝統素材の使用に対して補助金や固定資産税減免などのインセンティブを設計することで、規制とセットで地権者の自発的な協力を引き出せます。また、視点場からのフォトモンタージュは「この位置から見るとこう見える」という視覚的根拠を住民と共有するために有効であり、守るべき景観軸を具体的に示すことができます。一方、感情を考慮しない強硬策は反発を生み、制限を全廃すれば景観の価値そのものが失われます。"

    choices:["業者への説明は行わず行政の権限で強制撤去の手続きを進める","補助金制度の創設と優良事例の表彰制度を提示し、前向きな改修への協力を引き出す","商店街の懸念は無視して景観規制を即時全面適用する","既存の不調和な看板等を業者が自主改修しやすいよう、改修費用の一部を公費で支援する"],
    answers:[1,3],
    explanation:"景観形成において重要なのは、民間事業者を敵対勢力ではなく「景観づくりのパートナー」として巻き込む姿勢です。補助金制度（改修費の一部補助）は費用負担のハードルを下げることで自主的な改修を促し、表彰制度は地域のブランド向上という正の動機を与えます。また、改修費の公費支援は地権者の経済的不安を和らげ、「やりたいけど費用が心配」という層の参加を促進します。特に老舗店舗や中小の広告業者にとって改修コストは大きな負担となるため、インセンティブとサポートをセットで提示することが景観計画の実効性を高める鍵です。強制撤去や一方的な規制は短期的には効果があるように見えても、地域全体の信頼関係を損ない、長期的な計画運営を困難にします。"
  }
],

t02: [
  { difficulty:"普通",
    context:"平野部中央を通る河川沿いに中心市街地が広がる地方都市で、水災害リスクを低減するため既に策定されている立地適正化計画を変更し、防災指針の内容を追加する業務の担当責任者として進める。",
    question:"(1) 防災指針策定の事前調査として適切なものを2つ選べ。",
    choices:["想定最大規模降雨によるL2浸水想定区域と土砂災害警戒区域を特定し居住誘導区域と重ね合わせる","他都市の防災指針の冊子を収集してそのまま流用できる箇所を探す","現行の居住誘導区域内に含まれる要配慮者（高齢者・福祉施設等）の人口と立地を把握する","市内のカフェや観光施設の浸水被害状況をSNSで調査する"],
    answers:[0,2],
    explanation:"水災害対応の防災指針では「どこが危険で、そこに誰がいるか」を正確に把握することが出発点です。L2（想定最大規模）降雨に基づく浸水想定区域と土砂災害警戒区域をGISで居住誘導区域に重ね合わせることで、リスクが高いにもかかわらず誘導対象となっているエリアを客観的に特定できます。さらに、そのエリアに居住する要配慮者（高齢者・障害者・乳幼児・医療依存者等）の人口と福祉・医療施設の立地状況を把握することで、避難困難者が集中するホットスポットを先行して対策することができます。他都市の事例収集は参考になりますが、流用ではなく地域固有のリスク分析が必須です。SNS調査は客観的な調査手法とはいえません。"
  },
  { difficulty:"普通",
    context:"平野部中央を通る河川沿いに中心市街地が広がる地方都市で、水災害リスクを低減するため既に策定されている立地適正化計画を変更し、防災指針の内容を追加する業務の担当責任者として進める。",
    question:"(2) 居住誘導区域見直し時に住民の反発を抑える工夫として適切なものを2つ選べ。",
    choices:["危険エリアの住民全員に退去命令を出し強制移転を即時実施する","規制強化とセットで安全エリアへの移転補助金・固定資産税減免等のインセンティブを設計する","見直し内容は計画確定後まで住民に非公開とし、広報の手間を省く","GISを用いた「災害リスク×人口密度」の重ね合わせマップを公開し客観的根拠を住民と共有する"],
    answers:[1,3],
    explanation:"居住誘導区域の縮小は住民の土地・建物の資産価値に直接影響するため、「知らないうちに規制された」という不信感を避けることが最重要です。まず、GISで作成した「危険度マップ」を住民向けに公開することで、規制の根拠を透明性をもって示せます。「なぜここが外れるのか」を視覚的なデータで説明することは、反発を和らげる強力な手段です。次に、危険エリアから安全なエリアへの移転を促すインセンティブ（移転補助金・固定資産税減免・新居での容積率ボーナス等）を規制とセットで提示することで、「規制されるだけ」という被害感を軽減できます。退去命令という強制的手段は激しい反発を招き、計画自体の頓挫につながります。"
  },
  { difficulty:"難",
    context:"平野部中央を通る河川沿いに中心市街地が広がる地方都市で、水災害リスクを低減するため既に策定されている立地適正化計画を変更し、防災指針の内容を追加する業務の担当責任者として進める。",
    question:"(3) 関係者との調整として適切なものを2つ選べ。",
    choices:["河川管理者とは独立して都市計画変更手続きを先行させ完了後に報告する","河川・砂防管理者とハード整備のタイムラインを共有し都市計画のソフト対策と一体的に連携する","不動産・建築業界を計画の早期段階から勉強会に招き安全エリアでの新需要として理解を得る","規制強化の詳細は業界には秘密にして計画確定後に一斉通知する"],
    answers:[1,2],
    explanation:"防災指針の実効性を高めるためには、ハード対策とソフト対策の連携が不可欠です。河川管理者の堤防整備や遊水地整備のスケジュールと、都市計画側の誘導方針変更のタイムラインが一致していないと「堤防が完成すれば安全なのに誘導区域から外された」という矛盾が生じます。合同連絡会議を定期開催してスケジュールと安全度評価を共有することが重要です。また、開発規制の強化は不動産・建築業界に直接的な経済的影響をもたらします。計画の早期段階から業界を勉強会に招いて「コンパクトシティ化により安全な誘導区域内での質の高い住宅供給という新しいビジネス機会がある」という前向きな方向性を示すことで、反対勢力ではなく協力者として関与させることができます。"
  }
],

t03: [
  { difficulty:"普通",
    context:"豪雨により大規模な浸水や土砂災害の被害を受けた地方公共団体において、防災強化のために立地適正化計画の居住誘導区域を見直す業務の担当責任者として進める。",
    question:"(1) 見直しの事前調査として適切なものを2つ選べ。",
    choices:["L2想定浸水区域・土砂災害警戒区域と過去の被災履歴データをGISで空間的に重ね合わせる","市内の不動産価格トレンドを調査して区域縮小の範囲を決める","近隣自治体の区域面積を参考に縮小量を決定する","現行の居住誘導区域内の高齢者・要配慮者の人口と指定緊急避難場所までの経路安全性を確認する"],
    answers:[0,3],

  },
  { difficulty:"普通",
    context:"豪雨により大規模な浸水や土砂災害の被害を受けた地方公共団体において、防災強化のために立地適正化計画の居住誘導区域を見直す業務の担当責任者として進める。",
    question:"(2) 危険エリアの住民の反発を抑える「グラデーション化」として適切なものを2つ選べ。",
    choices:["危険エリアをすべて一律に即時除外し全員に強制移転を義務付ける","リスク度合いに応じて「即時除外エリア（レッドゾーン等）」と「建築耐水化等の条件付き居住維持エリア（イエローゾーン等）」に細分化する","危険エリアを除外する代わりに安全なエリアへの移転補助金・容積率ボーナスをセットで提示する","危険度に関係なく現状の区域を変更せず住民の不安を生まないようにする"],
    answers:[1,2],
    explanation:"居住誘導区域の一律除外は地価の急落や「補償もなく切り捨てられた」という強い反発を招き、計画が政治的に頓挫するリスクがあります。実効性ある見直しのためには2つのアプローチが重要です。まずリスクをグラデーションで評価し、浸水深が深く逃げ場のないレッドゾーンは即時除外・イエローゾーンはピロティ構造や止水板設置等を条件に居住継続可という「段階的な対応」を設計します。これにより全員を移転させるコストと反発を回避しつつ、最もリスクの高い地域から優先的に対策できます。次に規制（縮小）とセットで移転インセンティブ（補助金・減税・容積率緩和）を提示することで、「移転を選ぶ合理的な選択肢」を住民に示せます。現状維持は防災上の根本的な問題解決にならず、被災の繰り返しにつながります。"
  },
  { difficulty:"難",

    question:"(3) 関係者調整として適切なものを2つ選べ。",
    choices:["河川・砂防管理者と合同の「防災まちづくり連絡会議」を定期開催し整合を図る","規制強化の内容は計画確定後に業界へ一斉通知するだけでよい","地元不動産協会・建築業界を勉強会に招きコンパクトシティ化による新需要創出として理解を得る","河川管理者とは独立して都市計画を進め完了後に結果を報告する"],
    answers:[0,2],
    explanation:"居住誘導区域の見直しは都市計画単独では完結しません。河川管理者のハード整備（堤防・遊水地等）のスケジュールと都市計画のソフト対策（誘導方針変更）が乖離すると、「堤防が完成すれば安全なのに規制された」という住民の不満や、逆に「誘導区域に残っているのに洪水が繰り返される」という事態が発生します。合同連絡会議で安全度の評価基準とタイムラインを共有し、一体的な対策として機能させることが重要です。また不動産・建築業界は規制強化に最も敏感な利害関係者です。計画の早い段階から勉強会を開き、安全な誘導区域内での耐震・耐水性能の高い良質住宅の供給という新しいビジネス機会を示すことで、業界を協力者として引き込むことができます。"

t04: [
  { difficulty:"普通",
    context:"戸建て住宅が立ち並ぶ住宅地において住民主体で地区計画の導入に向けた合意形成に取り組もうとしている地区で、地方公共団体から派遣されたまちづくりコーディネーターとして活動する。",
    question:"(1) 事前調査として適切なものを2つ選べ。",
    choices:["全国の地区計画事例の文献を収集してよい事例をそのまま地区に当てはめる","ミニ開発による敷地細分化・空き家率・狭隘道路の割合など都市計画的課題の現況を把握する","地区外の交通量を調査して周辺道路の混雑状況を分析する","地区計画導入への住民の賛否・世代間の意識格差・参加意向を意識調査で把握する"],
    answers:[1,3],
    explanation:"住民主体の地区計画導入では、「この地区に地区計画が必要な客観的根拠」と「住民がどこまで合意できるか」の2点を事前に把握することが不可欠です。まず都市計画的課題として、ミニ開発による敷地細分化の状況・空き家率・セットバックが必要な狭隘道路の割合・壁面後退の現状などを調査することで、「このままでは住環境が悪化する」という根拠を住民に示せます。次に住民意識調査では建築制限への賛否・世代間（古くからの住民と新住民）の考え方の違い・まちづくり活動への参加意向を把握します。特に反対派の懸念点を事前に知ることで、ワークショップでの議論設計やコーディネート方針を調整できます。他地区の事例はあくまで参考であり、各地区の固有性を無視した流用は合意形成の障害になります。"
  },
  { difficulty:"普通",
    context:"戸建て住宅が立ち並ぶ住宅地において住民主体で地区計画の導入に向けた合意形成に取り組もうとしている地区で、地方公共団体から派遣されたまちづくりコーディネーターとして活動する。",
    question:"(2) 地区計画のルール検討における住民参加の工夫として適切なものを2つ選べ。",
    choices:["複数のルールパターン（松竹梅）を用意し30年後の街並みや資産価値への影響を視覚的に比較提示して住民に選ばせる","コーディネーターが最適なルールを単独で決定し住民には結果を通知する","LINE公式アカウントや情報共有Webサイトを開設しスマホから意見投票や進捗確認ができる仕組みを整える","一部の熱心な住民だけで議論を進め多数決で早期に決定する"],
    answers:[0,2],
    explanation:"住民主体の合意形成では「全員が参加できる環境づくり」と「選択肢を住民自身が選ぶプロセス」の2点が成功の鍵です。ルール検討では「敷地面積の最低限度を100㎡・150㎡・200㎡」などの複数パターンを用意し、それぞれを適用した場合の将来の街並みをフォトモンタージュで視覚化するとともに、資産価値への影響（売却時の価格・建替え可能性等）も示すことで住民が「自分事」として選択できます。またデジタルツールの活用により、平日の昼間しか開催できないワークショップに参加できない現役世代や、外出が困難な高齢者・育児中の親なども意見を表明できます。コーディネーターが一方的に決定したり、一部の熱心な住民だけで議論を進めると、最終段階でサイレントマジョリティの反発を招き計画が瓦解するリスクがあります。"
  },
  { difficulty:"難",
    context:"戸建て住宅が立ち並ぶ住宅地において住民主体で地区計画の導入に向けた合意形成に取り組もうとしている地区で、地方公共団体から派遣されたまちづくりコーディネーターとして活動する。",
    question:"(3) 関係者調整として適切なものを2つ選べ。",
    choices:["行政の都市計画部局担当者をワークショップにオブザーバーとして早期から招き実務的な文言の事前擦り合わせを行う","3分の2未満の同意でも提案可能な特例を活用し同意収集を省略する","不在地権者は連絡がとれないため同意書なしで手続きを進める","不在地権者や未同意者に個別訪問・オンライン相談を行い誤解を解消して同意率を引き上げる"],
    answers:[0,3],
    explanation:"住民提案（都市計画法第21条の2）には土地所有者等の「3分の2以上の同意」が法定要件であり、これをクリアできなければ提案自体が無効になります。まず行政担当者をワークショップにオブザーバーとして早期から関与させることで、住民が作った素案が建築基準法や自治体条例と矛盾していないか、法定化に必要な文言・基準を実務レベルで事前に確認できます。「住民案を作り直し」という最悪の事態を防げます。次に不在地権者（遠方に住む相続人等）や未同意者へのアプローチが同意率確保の鍵です。「建て替えができなくなる」「売れなくなる」等の誤解に対し、コーディネーターが中立的な立場で個別訪問やオンライン面談を行い、地区計画が資産価値の維持・向上に貢献することを丁寧に説明することで同意を得られます。特例制度での省略や無断での手続きは法的に無効です。"
  }
],

t05: [
  { difficulty:"普通",
    context:"歴史的風致維持向上計画の重点区域内で歴史的建築物や町家が残る一方、周辺の景観になじまない店舗やマンションの建設が進んでいる地区において、まちづくり整備計画を策定する業務の担当責任者として進める。",
    question:"(1) 適用すべき規制誘導手法として適切なものを2つ選べ。",
    choices:["景観法に基づく形態意匠制限（高さ・色彩・壁面後退等）を地区計画と連動させて強制力を持たせる","歴史的町家リノベーションへの補助金・容積率緩和と無電柱化・石畳風舗装の一体整備を推進する","開発を全面禁止にして現状を凍結し新規の建築行為を一切認めない","景観規制は設けず民間の自由な建築デザインに任せて市場原理で景観形成を促す"],
    answers:[0,1],
    explanation:"歴史的街並み保全の最大の課題は「規制だけでは地域が衰退し、自由にすれば景観が壊れる」というジレンマです。有効な手法は規制と誘導の組み合わせです。規制面では景観法に基づく高さ・壁面後退・色彩（マンセル値）の数値基準を地区計画と連動させることで、条例による法的強制力を持たせます。誘導面では歴史的町家をリノベーションした宿泊施設・店舗への補助金、容積率緩和を適用することで経済的インセンティブを与え、地権者が積極的に景観保全に参加できる仕組みを作ります。同時に無電柱化・石畳風舗装等の公共空間整備を一体的に行うことで、民間建物の改修効果を最大化します。全面禁止は土地利用の硬直化・人口流出を招き、完全自由化は景観破壊につながります。"
  },
  { difficulty:"普通",
    context:"歴史的風致維持向上計画の重点区域内で歴史的建築物や町家が残る一方、周辺の景観になじまない店舗やマンションの建設が進んでいる地区において、まちづくり整備計画を策定する業務の担当責任者として進める。",
    question:"(2) 計画策定における工夫として適切なものを2つ選べ。",
    choices:["厳しい規制を課せば地価が上昇するため固定資産税減免等の軽減策は不要とする","固定資産税減免・観光活用のための用途拡大等を規制とパッケージで提案する","デジタル技術は費用がかかるため伝統的な手作業の調査のみで対応する","3D点群データ・デジタルツインを活用して景観変化のシミュレーション基盤を整える"],
    answers:[1,3],
    explanation:"歴史的街並み保全の計画策定では、経済的支援策と先端技術活用の2つが実効性の鍵です。厳格な外観規制は地権者の改修コスト増・固定資産税負担という経済的ダメージをもたらします。これに対し、固定資産税の減免措置（登録有形文化財等の活用）・歴史的建築を観光資源として活用する際の用途制限緩和・改修補助金をパッケージで提示することで、規制を「守るコスト」ではなく「活かす価値」として捉え直すことができます。またモバイルマッピングシステム（MMS）やドローンによる3D点群データを取得し、歴史的街並みのデジタルツインを構築することで、「このマンションが建つと街並みがどう見えるか」を事前にシミュレーションして住民・開発者・行政が共通の視覚的根拠に基づいて議論できます。厳しい規制単独では空き家化・人口流出を加速させるリスクがあります。"
  },
  { difficulty:"難",
    context:"歴史的風致維持向上計画の重点区域内で歴史的建築物や町家が残る一方、周辺の景観になじまない店舗やマンションの建設が進んでいる地区において、まちづくり整備計画を策定する業務の担当責任者として進める。",
    question:"(3) 関係者調整として適切なものを2つ選べ。",
    choices:["文化財部局・景観部局・都市計画部局の横断「歴史まちづくり推進会議」を設置して審査をワンストップ化する","各部局が独立して審査を行い最後に担当者が全体を取りまとめる","地元地権者に対して歴史的町家を民間がサブリースするスキームを提案し安定賃料収入を示す","地権者への説明は規制施行後にまとめて行えば十分とする"],
    answers:[0,2],
    explanation:"歴史的まちづくりは複数の法律（歴史まちづくり法・景観法・都市計画法・建築基準法等）が複雑に絡み合うため、縦割り行政のままでは審査に時間がかかり民間の事業意欲を削ぎます。文化財・景観・都市計画の各部局が一堂に会する横断的な推進会議を設置してワンストップで許認可協議を進めることで、手続きの迅速化と各法律間の矛盾解消が可能になります。また地権者への誘導策として、歴史的町家を民間事業者が借り受けてカフェ・宿泊施設等に活用するサブリーススキームを提案することが有効です。地権者は改修コストやテナント探しのリスクを負わずに安定した賃料収入を得られ、地域には新たなにぎわいが生まれます。規制施行後の一方的な通知では地権者の反発を招き、計画全体の信頼性が損なわれます。"
  }
],

t06: [
  { difficulty:"普通",
    context:"人口30万人の地方都市において市街地内の幹線道路に隣接した約20haの民間施設の跡地を取得して広域避難地と地域防災拠点の機能を有する都市公園を新たに整備する業務の担当責任者として進める。",
    question:"(1) 事前調査として適切なものを2つ選べ。",
    choices:["公園の入場料設定と収益モデルを先に検討し事業費を圧縮する","周辺の避難対象人口・ハザードマップを確認し想定される災害種別とリスクを把握する","取得予定地の地形・地質・既存構造物・土壌汚染の有無を現況調査する","近隣の民間公園との競合関係を調査してサービス内容の差別化を図る"],
    answers:[1,2],
    explanation:"防災公園の整備では「防災上の必要性の根拠」と「敷地固有のリスク」の2点が最優先の調査事項です。まず周辺地域の避難対象人口（特に高齢者・福祉施設等の要配慮者）、想定される災害（地震・火災・浸水）のハザードマップを確認することで、公園に必要な規模・機能・避難収容力の根拠を得られます。次に民間施設跡地特有のリスクとして、地形・地質（液状化リスク等）・既存構造物（地下埋設物・基礎等）・土壌汚染の有無を精査します。特に工場跡地では有害物質による土壌汚染が発覚すると浄化コストが膨大になり、事業が大幅に遅延するリスクがあります。入場料収益モデルは防災公園には基本的になじまず、近隣民間公園との競合分析も防災公園の設計方針とは無関係です。"
  },
  { difficulty:"普通",
    context:"人口30万人の地方都市において市街地内の幹線道路に隣接した約20haの民間施設の跡地を取得して広域避難地と地域防災拠点の機能を有する都市公園を新たに整備する業務の担当責任者として進める。",
    question:"(2) 防災公園の計画における「平常時・災害時の二面性」を両立する工夫として適切なものを2つ選べ。",
    choices:["かまどベンチ・耐震性貯水槽・防災トイレなど防災設備を日常の公園景観に溶け込ませて配置する","防災機能を前面に出し芝生広場を廃止してコンクリート舗装のみにする","防災設備は見えにくい場所に隠して平常時の景観を最優先にする","ヘリコプター離着陸スペースや大型車両の進入路を確保しつつ平常時の動線と兼用する設計にする"],
    answers:[0,3],
    explanation:"防災公園の真価は「平常時は市民の憩いの場として愛され、災害時は迷わず機能する拠点」という二面性の実現にあります。平常時・災害時の兼用設計が重要です。かまどベンチは通常時はベンチとして使い災害時は炊き出しに使える、耐震性貯水槽は地下に埋設して上部を広場として活用するなど、防災機能を日常の景観に溶け込ませる「防災暗渠インフラ」の発想が有効です。また災害時にヘリコプターが離着陸するスペースや警察・消防・自衛隊の大型車両が進入・転回できる路の幅員は、平常時はイベント広場や多目的エリアとして兼用できるよう設計することで、防災・平常時の両機能を実現できます。コンクリートのみの設計は憩いの場としての機能を失い、防災設備を隠す設計は実際の災害時に機能不全を招きます。"
  },
  { difficulty:"難",
    context:"人口30万人の地方都市において市街地内の幹線道路に隣接した約20haの民間施設の跡地を取得して広域避難地と地域防災拠点の機能を有する都市公園を新たに整備する業務の担当責任者として進める。",
    question:"(3) 関係者調整として適切なものを2つ選べ。",
    choices:["防災・救護機関と合同の机上訓練を重ねテント配置・物資輸送動線・ヘリ発着を設計にフィードバックする","周辺住民・自主防災組織とワークショップを開き備蓄倉庫の場所や避難ルートを計画段階から共有する","防災機関とは完成後に初めて施設説明を行えば十分とする","住民への説明は整備完了後のオープニングセレモニーで行えばよい"],
    answers:[0,1],
    explanation:"防災公園は設計段階から実際の使い手である防災機関と住民の知見を組み込むことで、実効性が飛躍的に高まります。警察・消防・自衛隊との合同机上訓練では「発災直後にどのルートでどの大型車両が何台入るか」「ヘリはどの方向からアプローチするか」「テント・仮設トイレはどの場所に何基必要か」という具体的なオペレーションの課題が設計にフィードバックされます。完成後に発覚した問題を修正するコストは設計段階の修正の何倍にもなります。また周辺住民・自治会・自主防災組織とのワークショップでは「どこに備蓄倉庫があるか」「避難ルートはどこか」「夜間の開門手順は誰が知っているか」を共有します。住民が公園の防災機能を「知っている」「使いこなせる」状態にすることが、実際の避難行動につながります。"
  }
],

t07: [
  { difficulty:"普通",
    context:"大規模地震による被災の懸念のある沿岸部の地方公共団体において、津波・地震・液状化の複合的な災害リスクに備えた復興事前準備（事前復興計画）を策定する業務の担当責任者として進める。",
    question:"(1) 事前調査として適切なものを2つ選べ。",
    choices:["地震による液状化・地盤沈下リスクとL2津波浸水想定を重ね合わせ壊滅的被害が想定されるエリアを特定する","市内の観光消費額や宿泊者数のデータを収集して復興後の観光戦略を先に策定する","近隣自治体の復興計画をそのまま参考にして詳細な現地調査は省略する","被災後に速やかに仮設住宅や都市機能を移転できる内陸部・高台の低未利用地・公有地をリストアップする"],
    answers:[0,3],
    explanation:"復興事前計画は「被災したらどこに何を移転するか」を平時に具体的に決めておくことで、発災後の意思決定を劇的に速める仕組みです。まず「どこが最も危ないか」を特定するため、地震の揺れ・液状化・地盤沈下・L2津波の4つのリスクを重ね合わせた複合ハザードマップを作成します。これにより全面高台移転が必要な壊滅的被害想定エリアと部分的な対策で対応できるエリアを事前に区分できます。次に「移転先はどこか」を特定するため、内陸部や高台にある低未利用地・公有地（公園・農地等）を「復興の種地（代替地）」としてリストアップし、そこへ至る緊急輸送道路の耐震化状況も確認します。観光戦略は復興後の施策であり、事前計画の調査対象ではありません。"
  },
  { difficulty:"普通",
    context:"大規模地震による被災の懸念のある沿岸部の地方公共団体において、津波・地震・液状化の複合的な災害リスクに備えた復興事前準備（事前復興計画）を策定する業務の担当責任者として進める。",
    question:"(2) 沿岸部の生業（漁業等）を守る都市構造の工夫として適切なものを2つ選べ。",
    choices:["住居・作業場を含むすべての機能を高台に移転し沿岸部への立入を完全禁止する","「住居は安全な高台・作業場は沿岸部」という職住分離型の都市構造を計画に組み込む","高台と沿岸部を結ぶ自動運転等に対応したスマートモビリティ路線の確保を計画に明記する","漁業の衰退は避けられないため復興計画では産業の移転のみを優先する"],
    answers:[1,2],
    explanation:"沿岸部の復興計画における最大の難問は「安全な高台への移転」と「生業（漁業・観光業等）の継続」の両立です。漁業者が高台に住居を移しても作業場（漁港・加工場等）は沿岸部に存在し続けます。「住居は高台・作業場は沿岸」という職住分離型の都市構造を計画に明示することで、生業の放棄を強いることなく安全性を確保できます。しかしこの構造が機能するためには高台と沿岸部を結ぶ交通インフラが不可欠です。通常の道路に加え、将来の自動運転対応のスマートモビリティ路線（BRT・連節バス等）を事前に計画に組み込むことで、高齢化する漁業従事者でも移動が容易な環境を実現できます。完全禁止は産業の崩壊を招き、産業移転のみの計画では生業の本質的な維持ができません。"
  },
  { difficulty:"難",
    context:"大規模地震による被災の懸念のある沿岸部の地方公共団体において、津波・地震・液状化の複合的な災害リスクに備えた復興事前準備（事前復興計画）を策定する業務の担当責任者として進める。",
    question:"(3) 住民の「起きていない災害への無関心」を克服する合意形成として適切なものを2つ選べ。",
    choices:["計画は専門家だけで策定し完成後に住民へ配布すれば理解が得られる","住民参加型の「復興まちづくり模擬ワークショップ（DIG：地図演習）」を定期開催する","住民への説明は発災後にまとめて行えばよく事前の合意形成は不要とする","「被害が軽微・一部移転・全面高台移転」など被害規模に応じた複数の復興シナリオを事前に構築する"],
    answers:[1,3],
    explanation:"事前復興計画の最大の課題は「まだ起きていない災害の計画に住民が真剣に向き合わない」という無関心・無力感の壁です。2つのアプローチが有効です。まずDIG（Disaster Imagination Game：地図演習）を活用したワークショップでは、大地震が起きたという設定のもと実際の地図上に「ここの家は流される」「避難ルートはこの道路だが渋滞する」などを書き込む体験型のゲームを通じて、住民が「自分の街が被災する」という現実感をもって計画に参加できます。次に被害規模別の複数シナリオ（松竹梅）を用意することで、「どの程度の被害が来ても対応策がある」という安心感と、「自分たちの地区はどのシナリオに該当するか」という具体的な議論が可能になります。専門家だけの策定・発災後の説明では住民の行動変容は期待できません。"
  }
],

t08: [
  { difficulty:"普通",
    context:"地方都市の中心部に立地する老朽化が著しい公園（面積約1ha）の再整備を、都市公園法に基づくPark-PFI（公募設置管理制度）を活用して進める業務の担当責任者として、設置許可に至るまでの必要な手続を進める。",
    question:"(1) 公募前の事前調査として適切なものを2つ選べ。",
    choices:["民間事業者への公募前サウンディング（市場調査）を実施し採算ラインや公募条件の意向を把握する","対象公園の利用状況・老朽化施設の状況・周辺の商業動線・歩行者ニーズを調査する","民間事業者には情報提供せず突然公募を開始して競争原理を最大化する","公園の建蔽率特例（通常2%→Park-PFIでは12%へ緩和）の適用可否は公募後に確認する"],
    answers:[0,1],
    explanation:"Park-PFIの成否は「民間事業者が参入したくなる条件かどうか」で決まります。公募前サウンディング（対話型市場調査）では、飲食店・小売業者・デベロッパー等に「この公園で収益事業を行うとしたらどんな業態か」「採算が取れる設置許可期間は何年か」「公募条件でのNGポイントは何か」を事前に聴取します。これにより応募者ゼロの「公募不調」を防ぎ、実効性の高い公募要項を作成できます。同時に現地の利用実態調査（利用者の年齢層・滞留時間・利用目的）と周辺の商業動線・歩行者流量を把握することで、「どんな収益施設が地域ニーズと合致するか」の設計根拠が得られます。都市公園法上の建蔽率特例（Park-PFIでは通常2%から12%に緩和）の適用可否は公募前に確認が必要です。"
  },
  { difficulty:"普通",
    context:"地方都市の中心部に立地する老朽化が著しい公園（面積約1ha）の再整備を、都市公園法に基づくPark-PFI（公募設置管理制度）を活用して進める業務の担当責任者として、設置許可に至るまでの必要な手続を進める。",
    question:"(2) 公募要項の設計として適切なものを2つ選べ。",
    choices:["民間の収益はすべて行政が徴収し公園整備費に充当する条件にする","収益施設（カフェ等）の売上の一部を広場・園路（特定公園施設）の維持管理費に還元する収支循環モデルを明記する","仕様書を詳細に固めて民間のアイデアが入らないよう条件を絞り込む","選定審査では「地代納付額」の高さだけでなく公園全体のにぎわい創出・長期維持管理計画の実現性を高く評価する配点にする"],
    answers:[1,3],
    explanation:"Park-PFIの公募要項設計では「民間の創意工夫を引き出す」と「公共空間としての質を守る」のバランスが重要です。収支循環モデルでは民間のカフェ・物販等の売上の一部を、一般利用者が使う広場・園路・トイレ等（特定公園施設）の維持管理費に還元する仕組みを要項に明記します。これにより民間収益が公共空間の持続的な管理を支える「自立した公園経営」が実現します。審査の配点設計も重要で、単に「いくら地代を払うか」という金額の高さだけでなく、公園全体のにぎわい創出への貢献度・長期的な維持管理計画の具体性・地域イベントとの連携可能性等を総合評価します。逆に収益を全額徴収したり仕様書を過度に細かくすると、民間の自由なアイデアが発揮されず公募不調や形式的な提案しか集まりません。"
  },
  { difficulty:"難",
    context:"地方都市の中心部に立地する老朽化が著しい公園（面積約1ha）の再整備を、都市公園法に基づくPark-PFI（公募設置管理制度）を活用して進める業務の担当責任者として、設置許可に至るまでの必要な手続を進める。",
    question:"(3) 関係者調整として適切なものを2つ選べ。",
    choices:["公園のにぎわいが周辺エリアへの回遊を生む（まち全体の価値向上）メリットを説明し商店街と連携したイベント開催を事業計画に盛り込む","商店街の競合懸念は無視して公募を強行し事後に説明する","道路・建築・商業振興等の庁内関係部局をまとめた「Park-PFI推進タスクフォース」を設置しワンストップで協議する","庁内調整は公募後に個別部局と順番に行えばよく横断組織は不要とする"],
    answers:[0,2],
    explanation:"Park-PFIは「公園」という単一施設の話にとどまらず、周辺の商店街・まちのにぎわい・道路・建築許可・商業振興など多くの領域に影響します。商店街・地元住民への対応では「公園内に飲食店ができると既存の飲食店の客が奪われる」という競合懸念が最大の抵抗要因です。しかし国内外のウォーカブル化事例では、公園や広場のにぎわいが来街者の回遊を促し、周辺商店街全体の売上が増加することが多くのデータで示されています。商店街と連携したマルシェ・イベントを事業計画に組み込むことで「一緒に稼ぐ仕組み」として協力関係を構築できます。庁内調整では、テラス席の道路占用許可（道路管理者）・建築確認申請（建築指導部局）・商業振興補助（産業部局）など複数の許認可が並行して走るため、推進タスクフォース（横断組織）でワンストップ化することで事業スピードが格段に上がります。"

  { difficulty:"普通",

    answers:[0,1],

let currentArticleIdx = 0;
let currentThemeId = null;
let currentQ = 0;
let score = 0;
let total = 0;
let selectedAnswers = [];

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i===0&&tab==='article')||(i===1&&tab==='theme1')||(i===2&&tab==='theme')||(i===3&&tab==='theme3'));
  });
  document.getElementById('article-section').classList.toggle('active', tab==='article');
  document.getElementById('theme1-section').classList.toggle('active', tab==='theme1');
  document.getElementById('theme-section').classList.toggle('active', tab==='theme');
  document.getElementById('theme3-section').classList.toggle('active', tab==='theme3');
}

function renderArticleList() {
  const list = document.getElementById('article-list');
  list.innerHTML = ARTICLES.map((a, i) => `
    <div class="article-list-item" onclick="openArticle(${i})">
      <div class="article-list-left">
        <span class="article-tag">${a.tag}</span>
        <div class="article-list-title">${a.title}</div>
      </div>
      <span class="list-arrow">›</span>
    </div>`).join('');
}
function openArticle(idx) {
  currentArticleIdx = idx;
  const a = ARTICLES[idx];
  document.getElementById('detail-tag').textContent = a.tag;
  document.getElementById('detail-title').textContent = a.title;
  document.getElementById('detail-body').innerHTML = a.body.map(p => `<p>${p}</p>`).join('');
  document.getElementById('prev-btn').disabled = idx === 0;
  document.getElementById('next-article-btn').disabled = idx === ARTICLES.length - 1;
  document.getElementById('article-list-view').style.display = 'none';
  document.getElementById('article-detail-view').style.display = 'block';
  window.scrollTo(0, 0);
}
function showArticleList() {
  document.getElementById('article-list-view').style.display = 'block';
  document.getElementById('article-detail-view').style.display = 'none';
}
function navigateArticle(dir) {
  const next = currentArticleIdx + dir;
  if (next >= 0 && next < ARTICLES.length) openArticle(next);
}

function renderThemeList() {
  const view = document.getElementById('theme-list-view');
  let html = '';
  CATEGORIES.forEach(cat => {
    const items = THEMES.filter(t => t.cat === cat.key);
    if (!items.length) return;
    html += `<div class="category-label">${cat.label}</div><div class="theme-list">`;
    items.forEach(t => {
      html += `<div class="theme-item" onclick="startTheme('${t.id}')">
        <div class="theme-item-left">
          <span class="theme-cat-tag cat-${t.cat}">${cat.label}</span>
          <div class="theme-title">${t.title}</div>
          <div class="theme-subtitle">${t.sub}</div>
        </div>
        <span class="theme-arrow">›</span>
      </div>`;
    });
    html += '</div>';
  });
  view.innerHTML = html;
}

function startTheme(themeId) {
  currentThemeId = themeId;
  currentQ = 0; score = 0; total = 0; selectedAnswers = [];
  document.getElementById('theme-list-view').style.display = 'none';
  document.getElementById('quiz-view').style.display = 'block';
  renderQuestion();
  window.scrollTo(0, 0);
}

function showThemeList() {
  document.getElementById('theme-list-view').style.display = 'block';
  document.getElementById('quiz-view').style.display = 'none';
}

function renderQuestion() {
  const qs = QUESTIONS_BY_THEME[currentThemeId];
  const theme = THEMES.find(t => t.id === currentThemeId);
  const container = document.getElementById('quiz-view');
  const pct = qs.length > 0 ? (currentQ / qs.length) * 100 : 0;
  selectedAnswers = [];

  if (currentQ >= qs.length) {
    container.innerHTML = `
      <button class="back-btn" onclick="showThemeList()">← テーマ一覧に戻る</button>
      <div class="finish-card">
        <div style="font-size:1.8rem;">🎉</div>
        <div style="font-family:'Noto Serif JP',serif;font-size:.95rem;font-weight:700;margin-top:10px;">${theme.title}</div>
        <div class="finish-score">${score} / ${qs.length} 問正解</div>
        <div style="font-size:.8rem;color:var(--muted);">お疲れさまでした。</div>
        <div class="btn-row">
          <button class="retry-btn" onclick="startTheme('${currentThemeId}')">もう一度</button>
          <button class="back-theme-btn" onclick="showThemeList()">テーマ選択へ</button>
        </div>
      </div>`;
    return;
  }

  const q = qs[currentQ];
  container.innerHTML = `
    <button class="back-btn" onclick="showThemeList()">← テーマ一覧に戻る</button>
    <div class="quiz-header">
      <div class="quiz-theme-title">${theme.title}</div>
      <span class="score-badge">${score} / ${total}</span>
    </div>
    <div class="quiz-step">第 ${currentQ + 1} 問 / 全 ${qs.length} 問</div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-meta">
        <span class="quiz-difficulty diff-${q.difficulty}">${q.difficulty}</span>
      </div>
      <div class="quiz-context">${q.context}</div>
      <div class="quiz-question">${q.question}</div>
      <div class="select-hint">✏️ 正しいものを2つ選んでください</div>
      <div class="choices">
        ${q.choices.map((c, i) => `
          <button class="choice-btn" id="choice-${i}" onclick="toggleChoice(${i})">
            <span style="font-weight:600;margin-right:5px;">${String.fromCharCode(65+i)}.</span>${c}
          </button>`).join('')}
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitAnswer()" disabled>回答（0/2）</button>
      <div class="feedback-box" id="feedback"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">
        ${currentQ + 1 < qs.length ? '次の問題へ →' : '結果を見る'}
      </button>
    </div>`;
  document.getElementById('submit-btn').style.display = 'block';
}

function toggleChoice(idx) {
  const btn = document.getElementById(`choice-${idx}`);
  const pos = selectedAnswers.indexOf(idx);
  if (pos === -1) {
    if (selectedAnswers.length >= 2) return;
    selectedAnswers.push(idx);
    btn.classList.add('selected');
  } else {
    selectedAnswers.splice(pos, 1);
    btn.classList.remove('selected');
  }
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = selectedAnswers.length !== 2;
  submitBtn.textContent = `回答（${selectedAnswers.length}/2）`;
}

function submitAnswer() {
  const q = QUESTIONS_BY_THEME[currentThemeId][currentQ];
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
  document.getElementById('submit-btn').style.display = 'none';

  const correctSet = new Set(q.answers);
  const selectedSet = new Set(selectedAnswers);
  const isFullCorrect = q.answers.every(a => selectedSet.has(a)) && selectedAnswers.length === q.answers.length;

  q.choices.forEach((_, i) => {
    const btn = document.getElementById(`choice-${i}`);
    btn.classList.remove('selected');
    if (correctSet.has(i) && selectedSet.has(i)) {
      btn.classList.add('correct-final');
    } else if (!correctSet.has(i) && selectedSet.has(i)) {
      btn.classList.add('wrong-final');
    } else if (correctSet.has(i) && !selectedSet.has(i)) {
      btn.classList.add('missed');
    }
  });

  const feedback = document.getElementById('feedback');
  const correctLabels = q.answers.map(a => String.fromCharCode(65+a)).join('・');
  if (isFullCorrect) {
    feedback.className = 'feedback-box correct';
    feedback.innerHTML = `<div class="fb-title">✅ 正解！（正解：${correctLabels}）</div>${q.explanation}`;
    score++;
  } else {
    const partialCount = selectedAnswers.filter(a => correctSet.has(a)).length;
    if (partialCount > 0) {
      feedback.className = 'feedback-box partial';
      feedback.innerHTML = `<div class="fb-title">△ 一部正解（正解：${correctLabels}）</div>${q.explanation}`;
    } else {
      feedback.className = 'feedback-box wrong';
      feedback.innerHTML = `<div class="fb-title">❌ 不正解（正解：${correctLabels}）</div>${q.explanation}`;
    }
  }
  total++;
  document.getElementById('next-btn').style.display = 'block';
  document.querySelector('.score-badge').textContent = `${score} / ${total}`;
}

function nextQuestion() { currentQ++; renderQuestion(); window.scrollTo(0, 0); }

【従来型公共事業との比較：主な特徴】

①性能発注（アウトカム発注）
・従来型：行政が仕様を詳細に設計して発注（仕様発注）
・PFI：行政はサービス水準（例：「施設温度は○℃以上を維持する」）を提示し、達成方法は民間に委ねる
→民間の技術力・創意工夫が引き出される

②設計・建設・維持管理・運営の一括発注（バンドリング）
・ライフサイクルコスト（建設から廃棄までの全費用）の最小化を民間が追求できる
→建設時に維持管理しやすい設計を選ぶインセンティブが働く

③リスク分担
・最もよく管理できる主体がリスクを負担する（民間は需要変動リスク・行政は政策変更リスク等）
→不適切なリスク転嫁による事業破綻を防ぐ

④VFM（Value For Money）
・同一サービス水準を従来型と比較したコスト削減率（%）
・VFMがプラスであることがPFI採用の前提条件（保証ではない）

【期待される効果】
・公共サービスの質の向上
・財政負担の平準化（建設費の分割払い）
・民間のノウハウ・技術の活用`
},

  explanation:`【正解の骨子】地区整備計画で定めることができる内容とその効果。

【地区整備計画の定め得る事項（都市計画法第12条の5第5項）】

①地区施設の配置・規模
・区画道路・公園・緑地・広場等のコミュニティ施設
・幹線道路より細かい生活道路ネットワークの設計

②建築物等に関する事項
・用途の制限（例：1階は店舗のみ可、風俗営業禁止等）
・容積率の最高・最低限度
・建蔽率の最高限度
・敷地面積の最低限度（ミニ開発の防止）
・高さの最高限度（眺望・圧迫感の防止）
・壁面の位置の制限（セットバック・壁面線の統一）

・垣・柵の構造（生垣推奨等）

【当該市街地で期待される効果】
・老朽建替えが進む際に無秩序な開発を防ぎ、地区の居住環境を段階的に改善
・敷地細分化（ミニ開発）の抑制による住環境悪化の防止
・壁面後退・緑化により歩行者空間・景観の統一感を創出

  explanation:`【正解の骨子】総合設計制度の特徴と敷地内空地の効果。

【総合設計制度（建築基準法第59条の2）の概要】
・内容：敷地内に有効な空地（公開空地）を確保し、安全上・防火上・衛生上支障がないと認められる場合、特定行政庁（知事・市長等）が許可することで容積率・高さの最高限度を超えた建築が可能

【公開空地に期待される効果（複数）】
①歩行者の通行・滞留空間の確保
→建物周囲の広場・通路が一般に開放され、都市の回遊性・快適性が向上

②防災・避難空間
→大規模地震等の際に周辺住民の避難場所・一時滞留空間として機能

③市街地の通風・採光・緑化
→建物の高さが増す一方で地上部に空地を確保することで日照・通風・緑化面積を維持

④都市景観の向上
→セットバックによる視点場の確保やランドスケープデザインにより良好な景観を形成

【関連制度との整理】
・高度利用地区（都市計画法）：都市計画として容積率の最高・最低限度を定める制度で空地確保は要件ではない
・再開発等促進区を定める地区計画（都市計画法第12条の5第3項）：大規模開発でインフラ整備とセットで高容積を認める`

    "両制度はいずれも地方公共団体のみが利用できる制度であり、NPOや民間企業が市民緑地を設置・管理することは都市緑地法上認められていない",
    "市民緑地認定制度では土地の所有権が市区町村に移転することが認定の要件であり、土地所有者が所有権を保持したまま緑地を提供することはできない"
  ],
  answer:0,
  explanation:`【正解の骨子】市民緑地2制度の背景・共通点・相違点。

【創設の背景（市民緑地認定制度：平成29年）】
・少子高齢化・都市の縮退により空き地・低未利用地が増加
・行政による緑地管理の財政的限界
→民間（企業・NPO・地域団体等）が自ら緑地を整備・管理できる仕組みが必要

【両制度の共通点】
・都市緑地法に基づく制度
・市民が利用できる緑地（公開性）
・都市の緑地確保に貢献する目的

|項目|市民緑地契約制度|市民緑地認定制度（H29創設）|
|---|---|---|

|土地所有権|所有者が保持（貸付け）|所有者が保持（貸付け）|
|民間の役割|管理委託先として関与|自らが主体的に整備・管理|

【認定制度のメリット】
・民間の資金・ノウハウを活用した多様な緑地整備が可能
・管理コストの行政負担を削減`

    "盛土規制法では、盛土を行うすべての行為が許可制になり、自己の土地での少量の土砂移動も例外なく国土交通大臣の許可が必要とされる"
  ],
  answer:0,
  explanation:`【正解の骨子】盛土規制法の対象区域と防止措置。

【法改正の背景】
・令和3年7月 静岡県熱海市の土石流災害（不適切な盛土が崩落）
・従来の宅地造成等規制法は「都市計画区域内の宅地造成」が主な対象→森林・農地での盛土が規制の隙間に

【規制対象区域の2類型（改正の核心）】

①宅地造成等工事規制区域（旧法の規制区域に相当・拡充）
・宅地造成に伴う崩壊・流出リスクがある区域
・傾斜地・急傾斜地を含む宅地周辺

・定期的な是正状況の確認・報告徴収

s10: {

  explanation:`【正解の骨子】パーソントリップ調査の概要と近年の課題。

【パーソントリップ（PT）調査の概要】
・目的：都市圏内のすべての人の1日の移動（トリップ）実態を把握し、交通計画・都市計画の基礎データとする
・対象：都市圏内の一般家庭（無作為抽出）の5歳以上全員
・調査項目：
  - 移動の起点・終点（OD：Origin-Destination）
  - 移動目的（通勤・通学・買物・業務等）

  - 出発・到着時刻
・実施：おおむね10年ごとに三大都市圏・地方中枢都市圏等で実施

【近年生じている課題（複数の観点）】

①回収率の低下
・単身世帯増加・多忙化・個人情報意識の高まりにより訪問調査への協力が得にくい

②外国人世帯への対応
・在住外国人の増加に対応した多言語化・調査手法の工夫が必要

③テレワーク・ライフスタイルの多様化
・コロナ禍以降の通勤パターン変化により「平均的な1日」の移動が代表性を失いつつある

④スマートフォン・ETC等ビッグデータとの統合活用
・GPS位置情報・交通系ICカードデータ等との組み合わせによる調査の精度向上と省力化が課題`
},

s11: {
  year:"令和5年度 Ⅱ-1-3",
  question:"都市再生特別措置法に基づく立地適正化計画の「都市機能誘導区域」と「居住誘導区域」について、最も適切な説明はどれか。",
  choices:[
    "都市機能誘導区域は市全域を対象とした広域的な区域であり、居住誘導区域はその内側に設ける小規模な区域である。両区域外への開発は法律で禁止されており、違反には刑事罰が科される",
    "都市機能誘導区域は医療・福祉・商業等の都市機能を集約するために設定する区域であり、居住誘導区域は人口密度を維持し生活サービス・コミュニティを持続させるために設定する区域である。いずれも区域外への立地を強制的に禁止するものではなく、届出・勧告制による誘導が基本である",
    "両区域は都道府県が一方的に指定するものであり、市町村や住民が関与する手続きは法律上設けられていない"
  ],
  answer:1,
  explanation:`【正解の骨子】立地適正化計画の2つの誘導区域の設定の考え方と誘導の方法。

【都市機能誘導区域】

▷区域設定の考え方
・医療・福祉・商業・教育等の生活サービス施設を一定のエリアに集約し、徒歩や公共交通でアクセスできる「コンパクトな市街地」を形成
・鉄道駅・バス停等の公共交通結節点（徒歩圏内）を基本に設定
・居住誘導区域よりも小さい区域（核となる拠点）

▷誘導の方法
・区域外への誘導施設（病院・診療所・商業施設等）の立地には届出義務（着手30日前）
・市町村長は届出内容を審査し必要に応じて勧告（区域内立地を促す）
・区域内立地には補助金・容積率緩和等のインセンティブ

【居住誘導区域】

▷区域設定の考え方
・人口密度を一定水準以上に維持することで生活サービスや地域コミュニティを持続させる区域
・ハザードエリア（L2浸水想定区域・土砂災害特別警戒区域等）は原則として含めない（防災指針との整合）

▷誘導の方法
・区域外での3戸以上の住宅開発等には届出義務（着手30日前）＋勧告制
・強制移転制度ではなく「誘導」が基本

【制度の位置づけ】
・市町村が策定（義務ではない）
・都市計画マスタープランと整合が必要`
},

s12: {
  year:"令和5年度 Ⅱ-1-4",
  question:"都市における特別緑地保全地区制度と風致地区制度の違いとして、最も適切なものはどれか。",
  choices:[
    "特別緑地保全地区は都市緑地法に基づき良好な自然的環境を有する緑地を保全する地域地区であり、行為制限が厳しく土地所有者の申し出による買取り制度がある。一方、風致地区は都市計画法に基づき都市の風致（自然美・景観）を維持する地域地区で、建築物の建ぺい率・高さ・外観色彩等の建築規制が主体である",
    "特別緑地保全地区は都市計画法に基づく地域地区であり、区域内の樹木の伐採は一切禁止されるが建築物の新築は自由に認められる",
    "風致地区は文化財保護法に基づく制度であり、特別緑地保全地区と同様に土地所有者への買取り補償制度が設けられている"
  ],
  answer:0,
  explanation:`【正解の骨子】特別緑地保全地区と風致地区の制度比較。

|項目|特別緑地保全地区|風致地区|
|---|---|---|
|根拠法|都市緑地法|都市計画法|
|目的|良好な自然的環境を有する緑地の「保全」|都市の風致（樹木・水辺等の自然美・景観）の「維持」|
|指定対象|樹林地・湿地等の自然緑地|山麓・水辺・樹林地等の風致をなす地域|
|行為制限の特徴|建築物の新築・改築・増築、土地の開拓、立竹木の伐採等が原則禁止・許可制（厳格）|建蔽率・高さ・外観色彩・緑化率等の建築規制が主体（緩やか）|
|買取り制度|あり（土地所有者の申し出により地方公共団体等が買取り）|なし|
|行為の許可権者|都道府県知事等|条例による（地方公共団体）|

【特別緑地保全地区の特色】
・緑地の「現状凍結」的な保全が目的 → 行為制限は風致地区より厳格
・土地所有者の権利制約が大きいため、買取り制度（申し出買取り）で財産権に配慮
・買取り後は公有緑地として市民に開放可能

【風致地区の特色】
・建築物の建設自体は認めるが「風致に支障のない範囲」で規制
・建蔽率・外観色彩等の最低限の規制により景観の統一感を維持`
},

    "ハザードエリアの全区域が居住誘導区域に設定禁止とされているため、L2浸水想定区域内に立地する既存住宅地はすべて居住誘導区域から直ちに除外しなければならない"
  ],
  answer:0,
  explanation:`【正解の骨子】立地適正化計画における災害ハザードエリアの取り扱い。

【2020年改正（令和2年都市再生特別措置法改正）の概要】
・居住誘導区域に「災害ハザードエリア」を定めないこととした（法第81条第16項）
・防災指針の策定が努力義務化された

【居住誘導区域に定めてはならない主な区域（複数）】

①土砂災害特別警戒区域（レッドゾーン）
・砂防法・地すべり防止法・急傾斜地法に基づく
・建築物の構造規制・開発許可制

②津波災害特別警戒区域（オレンジゾーン）
・津波防災地域づくり法に基づく
・要配慮者施設等への許可制

③災害危険区域
・建築基準法第39条に基づき条例で定める区域
・住宅建築禁止等

④浸水想定区域（想定最大規模L2）の一定区域
・水防法に基づく浸水想定区域のうち特に危険な区域
→防災指針で当該地区の安全確保策を定めることが必要

【重要な解釈】
・既存の居住誘導区域内にハザードエリアが含まれる場合は「防災指針」の策定により安全確保策を講じることで当面の存置も可能（即時全除外ではない）`
},

s14: {
  year:"令和4年度 Ⅱ-1-2",
  question:"街路事業のB/C（費用便益比）算定における「基本3便益」の説明として、最も適切なものはどれか。",
  choices:[
    "街路事業の基本3便益は①走行時間短縮便益、②走行経費減少便益、③交通事故減少便益であり、これらを金銭換算して合計した値を総事業費（費用）で除したものがB/Cである",
    "街路事業の基本3便益には「沿道土地の地価上昇額」が含まれており、資産価値の増加分を便益として計上することが算定方法の中心である",
    "B/C算定では走行時間短縮便益のみを便益として計上し、交通事故や燃費等の経済的効果は「ストック効果」として便益には含めない"
  ],
  answer:0,
  explanation:`【正解の骨子】街路事業B/Cの算定方法と3便益。

【基本3便益の内容】

①走行時間短縮便益
・道路整備により渋滞が緩和・移動時間が短縮されることによる便益
・時間の価値単価（円/時間）×短縮時間量で算定
・旅客（乗用車・バス等）と貨物（トラック等）に分けて算定

②走行経費減少便益
・走行速度の向上・渋滞解消により燃料費・タイヤ摩耗費等が減少する便益
・速度別の車種別走行経費単価を用いて算定

③交通事故減少便益
・道路整備により交通事故件数・死傷者数が減少することによる便益
・事故類型別の事故損失額単価×事故減少件数で算定

【B/C算定の方法】
B/C ＝ 便益の現在価値の合計 ÷ 費用の現在価値の合計
（便益・費用ともに社会的割引率4%等で現在価値化）
B/C ≥ 1.0 が採択基準の目安

【基本3便益以外のストック効果（例）】
・企業立地・生産性向上効果
・観光・交流人口の増加
・沿道まちづくり・土地利用の高度化
・物流効率化・サプライチェーン強化`
},

s15: {
  year:"令和4年度 Ⅱ-1-3",
  question:"建築基準法において、道路の状況により建築物・敷地に課せられる規制として、最も適切な説明はどれか。",
  choices:[
    "接道義務（建築基準法第43条）と前面道路幅員による容積率制限（同法第52条）の2種類が代表的な規制であり、前者は安全な避難・消防活動の確保、後者は市街地における道路交通量と建築物規模のバランス確保を目的とする",
    "前面道路幅員による容積率制限は商業地域にのみ適用され、住居系用途地域では前面道路幅員にかかわらず指定容積率をそのまま使用できる",
    "接道義務は建築物の敷地が幅員4m以上の道路に2m以上接することを求めるものであり、この義務を満たさない敷地では増築・改築も一切認められない"
  ],
  answer:0,
  explanation:`【正解の骨子】道路と建築物の関係に関する2つの主要規制。

【①接道義務（建築基準法第43条）】
・内容：建築物の敷地は幅員4m以上の道路（建基法上の道路）に2m以上接しなければならない
・目的：火災・震災時の避難路確保、消防車・救急車のアクセス確保
・例外：建築審査会の同意を得て特定行政庁が許可した場合（43条2項許可）
・2項道路（みなし道路）：幅員4m未満でも特定行政庁が指定した道路→セットバック義務

【②前面道路幅員による容積率制限（建築基準法第52条）】
・内容：前面道路の幅員が12m未満の場合、容積率は「指定容積率」と「前面道路幅員×法定乗数」の小さい方
  - 住居系用途地域：前面道路幅員（m）× 4/10
  - 商業系・工業系：前面道路幅員（m）× 6/10
・目的：前面道路の交通容量と建築物の規模（入居人口・来訪者数）を対応させ、慢性的な渋滞・歩行者環境悪化を防ぐ

【具体例】
・住居系・指定容積率200%・前面道路4m の場合
  → 4m × 40% = 160% < 200%
  → 実際に使える容積率は160%

【その他の道路関連規制】
・道路斜線制限：道路境界線から一定の角度以上の高さで建築を制限（圧迫感・採光・通風確保）
・壁面後退区域：地区計画等で定めるセットバック線`
},

s16: {
  year:"令和4年度 Ⅱ-1-4",
  question:"平成3年の生産緑地法改正に基づく生産緑地制度と、平成29年創設の特定生産緑地制度について、最も適切な説明はどれか。",
  choices:[
    "生産緑地制度は、市街化区域内の農地を農地として管理することを条件に固定資産税の農地課税（宅地並み課税の回避）・相続税納税猶予等の優遇を付与する制度で、指定後30年を経過した平成34（令和4）年に買取り申し出が可能になる「2022年問題」が生じた。特定生産緑地制度はこの問題に対処するため、所有者の同意を得て指定を10年延長できる仕組みを創設した",
    "特定生産緑地の指定を受けた農地は永久に買取り申し出ができなくなるため、所有者の相続が発生した場合の税負担が著しく増加する仕組みになっている",
    "生産緑地地区は農林水産大臣が三大都市圏の全市区町村に一律に指定するものであり、市町村の都市計画判断の余地はない"
  ],
  answer:0,
  explanation:`【正解の骨子】生産緑地制度の概要と特定生産緑地制度創設の背景。

【平成3年改正・生産緑地制度の概要】
・対象：三大都市圏（首都圏・近畿圏・中部圏）の市街化区域内農地
・指定条件：500㎡以上、農業の継続が確実等
・優遇措置：
  - 固定資産税：農地課税（宅地並み課税からの大幅軽減）
  - 相続税：納税猶予（農業継続を条件に相続税を猶予）
・制約：建築行為の制限（農地としての管理が義務）
・買取り申し出：指定後30年が経過した後、市町村への買取り申し出が可能（申し出があれば市は時価で買取り義務）

【2022年問題（特定生産緑地制度創設の背景）】
・平成4（1992）年に一斉指定→平成34（2022）年に一斉30年到達
→大量の生産緑地で買取り申し出が可能になり、宅地転換・固定資産税増加が集中するリスク
→地価下落・市街地環境悪化の懸念

【特定生産緑地制度（平成29年法改正）の概要】
・30年到来前に所有者の同意を得て「特定生産緑地」に指定
→買取り申し出可能時期を10年延長（繰り返し延長可能）
→その間は引き続き固定資産税の農地課税・相続税納税猶予が継続
・指定は任意（所有者の同意が必要）`
},

s17: {
  year:"令和3年度 Ⅱ-1-1",
  question:"東日本大震災復興において活用された「防災集団移転促進事業」と「土地区画整理事業」の比較として、最も適切な説明はどれか。",
  choices:[
    "防災集団移転促進事業は危険区域からの住宅の集団移転に特化した事業で移転先の宅地整備と移転元地の買取りが中心、土地区画整理事業は面的な基盤整備（道路・公園等）と権利変換を伴う市街地の再構築が中心であり、東日本大震災では壊滅的被害地区での高台移転に前者を、市街地の面的な基盤整備・再建に後者を主に活用した",
    "防災集団移転促進事業と土地区画整理事業はいずれも民間デベロッパーが施行主体となり、行政は補助金を支出するだけで計画への関与は行わない",
    "土地区画整理事業は個人住宅の再建を直接支援する補助金制度であり、事業区域内の住民は減歩なしで原位置に新居を建設できる"
  ],
  answer:0,
  explanation:`【正解の骨子】防災集団移転促進事業と土地区画整理事業の概要・特徴・東日本大震災での使い方。

【防災集団移転促進事業】
・目的：災害危険区域等の居住者を安全な高台・内陸部へ集団的に移転
・内容：
  - 移転先の宅地造成・住宅建設支援（宅地取得費・住宅建設費の補助）
  - 移転元地を市町村が買取り（住宅用地としての再利用禁止）
・特徴：住居の移転に特化しており、生業（漁業等）の継続は別途対応が必要
・東日本大震災での活用：津波で壊滅・または壊滅的被害を受けた沿岸集落での高台移転に多用

【土地区画整理事業】
・目的：道路・公園等の公共施設整備と宅地の合理的利用を一体的に実現
・内容：
  - 換地設計（減歩を伴い公共施設用地を生み出す）
  - 基盤整備（道路・上下水道・公園等）
・特徴：面的な基盤整備ができる・権利関係が複雑・事業期間が長い
・東日本大震災での活用：市街地が残る地区での嵩上げ（地盤を高くする）と一体的な基盤整備、商業地・住宅地の再建

【両事業の相違点まとめ】
|項目|防災集団移転|土地区画整理|
|---|---|---|
|主な対象|危険区域の住宅移転|市街地の面的再建|
|権利処理|買取りが基本|換地（権利変換）|
|インフラ整備|限定的|道路・公園等の面的整備|`
},

  choices:[
    "都市再生特別措置法に基づく「低未利用土地権利設定等促進計画」は、市町村が作成した計画に基づき、低未利用地に使用権・利用権を設定することを可能にする制度であり、所有者が所有権を保持したまま一定期間の利用権を第三者に付与できる",
    "低未利用地の活用には必ず所有権の売買が伴うため、所有者が土地を売りたくない場合は法律上活用できない",
    "スポンジ化対策として最も有効な手法は、すべての低未利用地を行政が強制収用して公共利用に転換することであり、民間活用の仕組みは現在の法令には存在しない"
  ],
  answer:0,
  explanation:`【正解の骨子】低未利用地の所有権・利用権分離型活用手法の概要とメリット・留意点。

【手法の例：低未利用土地権利設定等促進計画（都市再生特別措置法）】
・創設：2020年都市再生特別措置法改正
・仕組み：
  1. 市町村が「低未利用土地利用促進協定」または「権利設定等促進計画」を作成
  2. 計画に基づき、低未利用地の所有者の同意のもとで使用権・地上権・賃借権等を設定
  3. 所有者は所有権を手放さずに、農業者・NPO・事業者等の利用者に一定期間の利用権を付与

【所有権・利用権分離のメリット】
・所有者：土地を売却せずに管理コストを削減・賃料収入を得られる
・利用者：低コストで土地を活用（暫定的なコミュニティ農園・駐車場・仮設店舗等）
・行政：空き地の管理不全（雑草・不法投棄等）問題の解消

【活用するための留意点】
・利用期間終了後の返還条件・原状回復義務の明確化
・相続等で所有者が変わった場合の権利継承の扱い
・暫定利用から恒久利用への移行検討（将来の土地利用の整序）

【関連手法：土地の集約・再編の手法の例】
・低未利用土地利用促進区域（立地適正化計画に設定）：集約・再編の計画的な位置づけ
・立地誘導促進施設協定（コモンズ協定）：空き地を地域共有空間として管理`
},

s19: {
  year:"令和3年度 Ⅱ-1-3",
  question:"既存建築物をリノベーションする際に用途変更を行う場合、用途地域による用途規制を緩和する手法として、最も適切な説明はどれか。",
  choices:[
    "用途地域による用途規制を緩和する手法として、①特定用途制限地域の活用（非線引き都市計画区域・準都市計画区域で用途を追加制限・緩和する地域地区）と②用途地域の変更（市町村が都市計画審議会等の手続きを経て用途地域そのものを変更する方法）がある。前者は柔軟な適用が可能で後者は手続きが重いが地区全体への恒久的効果がある",
    "既存建築物の用途変更は建築確認申請が不要であるため、用途地域に関係なく任意の用途に変更することが認められている",
    "用途規制を緩和するためには国土交通大臣の特別許可が必要であり、市町村レベルでの手続きで緩和することはできない"
  ],
  answer:0,
  explanation:`【正解の骨子】用途変更時の用途規制緩和手法（2つ）の特徴と手続き。

【手法①：特例容積率適用地区・用途地域の変更以外の手法】

▷地区計画（用途制限の緩和条例）
・都市計画法第12条の4に基づく地区計画を活用し、用途地域では禁止されている用途を「当該地区内に限り」許可する条例を制定
・手続き：地区計画の都市計画決定（市町村→都市計画審議会→都道府県協議）
・メリット：地区の特性に合わせた細かい用途の許容が可能
・留意点：地区計画決定まで一定の時間が必要

▷特定用途誘導地区（都市再生特別措置法）
・立地適正化計画の都市機能誘導区域内で、誘導施設の用途を容積率・用途規制の特例で誘導する地区
・病院・子育て施設等の誘導したい用途を積極的に許容

【手法②：用途地域の変更】
・都市計画法に基づき市町村が用途地域そのものを変更する手続き
・手続き：原案作成→公告縦覧→意見聴取→都市計画審議会→都道府県知事協議→告示
・メリット：地区全体への恒久的な効果
・留意点：手続きが重く時間がかかる・周辺への影響も大きい

【実務上の重要ポイント】
・用途変更で延べ面積200㎡超になる場合は建築確認申請が原則必要
・既存不適格建築物の用途変更には特例措置あり（法第87条）`

  explanation:`【正解の骨子】都市公園が生物多様性保全に果たす多面的な役割と具体的な施策・事業。

【都市公園の多面的な役割（生物多様性の観点）】

①ビオトープネットワークの核・踏み石機能

let currentTheme1Id = null;
let currentQ1Done = false;
let selectedAnswer1 = null;

function renderThemeList1() {
  const view = document.getElementById('theme1-list-view');
  let html = '';
  CATEGORIES1.forEach(cat => {
    const items = THEMES1.filter(t => t.cat === cat.key);
    if (!items.length) return;
    html += `<div class="category-label">${cat.label}</div><div class="theme-list">`;
    items.forEach(t => {
      html += `<div class="theme-item" onclick="startTheme1('${t.id}')">
        <div class="theme-item-left">
          <span class="theme-cat-tag cat1-${t.cat}">${cat.label}</span>
          <div class="theme-title">${t.title}</div>
          <div class="theme-subtitle">${t.sub}</div>
        </div>
        <span class="theme-arrow">›</span>
      </div>`;
    });
    html += '</div>';
  });
  view.innerHTML = html;
}

function startTheme1(themeId) {
  currentTheme1Id = themeId;
  currentQ1Done = false;
  selectedAnswer1 = null;
  document.getElementById('theme1-list-view').style.display = 'none';
  document.getElementById('quiz1-view').style.display = 'block';
  renderQuestion1();
  window.scrollTo(0, 0);
}

function showThemeList1() {
  document.getElementById('theme1-list-view').style.display = 'block';
  document.getElementById('quiz1-view').style.display = 'none';
}

function renderQuestion1() {
  const q = QUESTIONS1_BY_THEME[currentTheme1Id];
  const container = document.getElementById('quiz1-view');

  container.innerHTML = `
    <button class="back-btn" onclick="showThemeList1()">← テーマ一覧に戻る</button>
    <div class="quiz-card">
      <div style="font-size:.68rem;color:var(--muted);margin-bottom:8px;font-weight:500;">${q.year}</div>
      <div class="quiz-question" style="font-size:.9rem;">${q.question}</div>
      <div class="select-hint" style="margin-top:4px;">✏️ 最も適切なものを1つ選んでください</div>
      <div class="choices" style="margin-top:10px;">
        ${q.choices.map((c, i) => `
          <button class="choice-btn" id="q1choice-${i}" onclick="selectAnswer1(${i})">
            <span style="font-weight:700;margin-right:6px;">${i+1}.</span>${c}
          </button>`).join('')}
      </div>
      <button class="submit-btn" id="submit1-btn" onclick="submitAnswer1()" disabled style="display:block;margin-top:12px;">回答する</button>
      <div id="feedback1-box"></div>
    </div>`;
}

function selectAnswer1(idx) {
  if (currentQ1Done) return;
  selectedAnswer1 = idx;
  document.querySelectorAll('[id^="q1choice-"]').forEach((b, i) => {
    b.classList.toggle('selected', i === idx);
  });
  document.getElementById('submit1-btn').disabled = false;
}

function submitAnswer1() {
  if (currentQ1Done) return;
  currentQ1Done = true;

  const q = QUESTIONS1_BY_THEME[currentTheme1Id];
  document.querySelectorAll('[id^="q1choice-"]').forEach(b => b.disabled = true);
  document.getElementById('submit1-btn').style.display = 'none';

  const isCorrect = selectedAnswer1 === q.answer;

  document.querySelectorAll('[id^="q1choice-"]').forEach((b, i) => {
    b.classList.remove('selected');
    if (i === q.answer) b.classList.add('correct-final');
    else if (i === selectedAnswer1 && !isCorrect) b.classList.add('wrong-final');
  });

  const correctLabel = q.answer + 1;
  const fbBox = document.getElementById('feedback1-box');
  const explanationHtml = q.explanation.replace(/\n/g, '<br>').replace(/【(.+?)】/g, '<strong style="color:var(--accent2);">【$1】</strong>').replace(/▶/g, '<span style="color:var(--accent);">▶</span>');

  fbBox.innerHTML = `
    <div class="feedback-box ${isCorrect ? 'correct' : 'wrong'}" style="display:block;margin-top:12px;">
      <div class="fb-title">${isCorrect ? '✅ 正解！' : `❌ 不正解（正解：${correctLabel}）`}</div>
      <div style="margin-top:10px;font-size:.82rem;line-height:1.85;">${explanationHtml}</div>
    </div>
    <button class="back-theme-btn" style="width:100%;margin-top:12px;" onclick="showThemeList1()">← テーマ一覧に戻る</button>`;

  window.scrollTo(0, 0);
}

      "整備した広場・歩行空間が特定の集団に占有されたり、騒音・ゴミ等の問題で近隣住民とのトラブルが生じるリスクがある。対策として、広場の利用ルール（時間・利用者・活動の種類等）を地域住民との合意のもとで策定し、苦情対応・調整役としてのコミュニティ組織の機能を強化する"
    ],
    answer:2,
    explanation:"賑わい施設・広場整備後の近隣トラブルは実際の課題。利用ルールの「共同形成（コデザイン）」が鍵であり、整備前から近隣住民・地権者・行政が参加するワークショップで合意形成を進めることが重要。令和8年現在、パブリックスペースの活用に関するガイドライン（国交省「広場・空地の活用ガイドライン」等）では利用ルールの策定と住民参加プロセスが標準的な手続きとして位置づけられている。"

};

// ===== Ⅲ UI ロジック =====

let currentTheme3Id = null;
let currentQ3 = 0;
let score3 = 0;
let total3 = 0;
let selectedAnswer3 = null;
let q3Done = false;

function renderThemeList3() {
  const view = document.getElementById('theme3-list-view');
  let html = '';
  CATEGORIES3.forEach(cat => {
    const items = THEMES3.filter(t => t.cat === cat.key);
    if (!items.length) return;
    html += `<div class="category-label">${cat.label}</div><div class="theme-list">`;
    items.forEach(t => {
      html += `<div class="theme-item" onclick="startTheme3('${t.id}')">
        <div class="theme-item-left">
          <span class="theme-cat-tag cat3-${t.cat}">${cat.label}</span>
          <div class="theme-title">${t.title}</div>
          <div class="theme-subtitle">${t.sub}</div>
        </div>
        <span class="theme-arrow">›</span>
      </div>`;
    });
    html += '</div>';
  });
  view.innerHTML = html;
}

function startTheme3(themeId) {
  currentTheme3Id = themeId;
  currentQ3 = 0; score3 = 0; total3 = 0;
  document.getElementById('theme3-list-view').style.display = 'none';
  document.getElementById('quiz3-view').style.display = 'block';
  renderQuestion3();
  window.scrollTo(0, 0);
}

function showThemeList3() {
  document.getElementById('theme3-list-view').style.display = 'block';
  document.getElementById('quiz3-view').style.display = 'none';
}

function renderQuestion3() {
  const qs = QUESTIONS3[currentTheme3Id];
  const theme = THEMES3.find(t => t.id === currentTheme3Id);
  const container = document.getElementById('quiz3-view');
  selectedAnswer3 = null;
  q3Done = false;

  if (currentQ3 >= qs.length) {
    container.innerHTML = `
      <button class="back-btn" onclick="showThemeList3()">← テーマ一覧に戻る</button>
      <div class="finish-card">
        <div style="font-size:1.8rem;">🎉</div>
        <div style="font-family:'Noto Serif JP',serif;font-size:.95rem;font-weight:700;margin-top:10px;">${theme.title}</div>
        <div class="finish-score">${score3} / ${qs.length} 問正解</div>
        <div style="font-size:.8rem;color:var(--muted);">お疲れさまでした。</div>
        <div class="btn-row">
          <button class="retry-btn" onclick="startTheme3('${currentTheme3Id}')">もう一度</button>
          <button class="back-theme-btn" onclick="showThemeList3()">テーマ選択へ</button>
        </div>
      </div>`;
    return;
  }

  const q = qs[currentQ3];
  const pct = (currentQ3 / qs.length) * 100;
  const labels = ['A', 'B', 'C'];

  container.innerHTML = `
    <button class="back-btn" onclick="showThemeList3()">← テーマ一覧に戻る</button>
    <div class="quiz-header">
      <div class="quiz-theme-title">${theme.title}</div>
      <span class="score-badge">${score3} / ${total3}</span>
    </div>
    <div class="quiz-step">${q.step} &nbsp; 第 ${currentQ3 + 1} 問 / 全 ${qs.length} 問</div>
    <div class="progress-bar-wrap"><div class="progress-bar" style="width:${pct}%"></div></div>
    <div class="quiz-card">
      <div class="quiz-question" style="font-size:.88rem;">${q.question}</div>
      <div class="select-hint" style="margin-top:4px;">✏️ 最も適切なものを1つ選んでください</div>
      <div class="choices" style="margin-top:10px;">
        ${q.choices.map((c, i) => `
          <button class="choice-btn" id="q3choice-${i}" onclick="selectAnswer3(${i})">
            <span style="font-weight:700;margin-right:6px;">${labels[i]}.</span>${c.replace(/\n/g,'<br>')}
          </button>`).join('')}
      </div>
      <button class="submit-btn" id="submit3-btn" onclick="submitAnswer3()" disabled style="display:block;margin-top:12px;">回答する</button>
      <div id="feedback3-box"></div>
    </div>`;
}

function selectAnswer3(idx) {
  if (q3Done) return;
  selectedAnswer3 = idx;
  document.querySelectorAll('[id^="q3choice-"]').forEach((b, i) => {
    b.classList.toggle('selected', i === idx);
  });
  document.getElementById('submit3-btn').disabled = false;
}

function submitAnswer3() {
  if (q3Done) return;
  q3Done = true;

  const q = QUESTIONS3[currentTheme3Id][currentQ3];
  document.querySelectorAll('[id^="q3choice-"]').forEach(b => b.disabled = true);
  document.getElementById('submit3-btn').style.display = 'none';

  const isCorrect = selectedAnswer3 === q.answer;
  const labels = ['A', 'B', 'C'];

  document.querySelectorAll('[id^="q3choice-"]').forEach((b, i) => {
    b.classList.remove('selected');
    if (i === q.answer) b.classList.add('correct-final');
    else if (i === selectedAnswer3 && !isCorrect) b.classList.add('wrong-final');
  });

  if (isCorrect) score3++;
  total3++;

  const explanationHtml = q.explanation
    .replace(/\n/g, '<br>')
    .replace(/【(.+?)】/g, '<strong style="color:var(--accent2);">【$1】</strong>')
    .replace(/①|②|③/g, s => `<strong>${s}</strong>`);

  document.getElementById('feedback3-box').innerHTML = `
    <div class="feedback-box ${isCorrect ? 'correct' : 'wrong'}" style="display:block;margin-top:12px;">
      <div class="fb-title">${isCorrect ? `✅ 正解！（${labels[q.answer]}）` : `❌ 不正解（正解：${labels[q.answer]}）`}</div>
      <div style="margin-top:10px;font-size:.82rem;line-height:1.85;">${explanationHtml}</div>
    </div>
    <button class="next-btn" style="display:block;margin-top:10px;" onclick="nextQuestion3()">
      ${currentQ3 + 1 < QUESTIONS3[currentTheme3Id].length ? '次の問題へ →' : '結果を見る'}
    </button>`;

  document.querySelector('#quiz3-view .score-badge').textContent = `${score3} / ${total3}`;
  window.scrollTo(0, 0);
}

function nextQuestion3() { currentQ3++; renderQuestion3(); window.scrollTo(0, 0); }

renderArticleList();
renderThemeList();
renderThemeList1();
renderThemeList3();
</script>
